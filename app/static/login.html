<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonderland — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-mark"><img src="brand/sakara-mark-primary.png" alt="" class="brand-mark">wonderland</div>
    <p class="login-sub">Internal sign in for WCCN staff.</p>
    <form id="login-form">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="username">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn btn-accent" style="width:100%; margin-top:6px;">Sign in</button>
    </form>
  </div>
  <script src="login.js"></script>
</body>
</html>
